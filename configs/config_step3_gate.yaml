# STEP 3 GATE: combined (sensorimotor) across a WIDE tempo range (0.4-0.8).
# Identical to the final sensorimotor config (seed 746, pulse auditory) EXCEPT
# tempo.mode = range. Trains up to 1000 rounds (~200k steps) or until it diverges
# to NaN, whichever first; checkpoints every 2000 steps feed the step/tempo viewer.
# Tests whether the vestibular-scaffolded combined condition holds multiple tempos.
experiment:
  dt: 0.05
  duration: 10.0
  mode: sensorimotor
  random_phase: true
  zero_mean_beat: true
  n_training_rounds: 1000
  name: rev_step3_multitempo_gate
  random_seed: 746
  tempo:
    mode: range
    value: 0.5
    min: 0.4
    max: 0.8
    step: 0.1                     # -> [0.4, 0.5, 0.6, 0.7, 0.8]

  auditory_envelope:
    shape: pulse
    width: 0.1
    amplitude_jitter: 0.0
    width_jitter: 0.0

  gait_variability:
    mode: none
    sigma: 0.04
    hurst: 0.85

logging:
  level: INFO

network:
  alpha_H: 0.1
  alpha_x: 1
  associative_size: 64
  higher_size: 0                  # single layer first; if it fails, enable hierarchy
  inference_learning_rate_H: 0.049706088801492805
  inference_learning_rate_x: 0.26109253426023427
  n_inference_steps: 5
  vestibular_size: 1
  weight_learning_rate_H: 0.47037325216247716
  weight_learning_rate_x: 0.49832988896925373

saving:
  base_dir: experiments/revision2
  log_every: 2000
  save_every: 2000          # regular checkpoints for the step/tempo viewer

testing:
  continuation: false
  n_inference_rounds: 10          # lighter eval during the gate (5 tempos x 10); per-tempo eval done afterward
  prediction_timing: after
  test_duration: 20.0
