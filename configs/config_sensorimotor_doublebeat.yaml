experiment:
  dt: 0.05                    # simulation timestep in seconds
  duration: 10.0              # total duration per training round in seconds
  mode: "doublebeat"          # "sensorimotor" or "doublebeat"
  n_training_rounds: 1000     # number of training rounds
  name: "doublebeat_exp"      # experiment name (timestamp will be appended)
  random_seed: 164            # random seed for weight initialization
  tempo:
    mode: "range"             # "single" or "range"
    value: 0.5                # used when mode is "single"
    min: 0.4                  # used when mode is "range"
    max: 0.8                  # used when mode is "range"
    step: 0.1                 # discrete steps for range mode

network:
  # Layer sizes
  higher_size: 4              # m units in H (set to 0 to disable hierarchy)
  associative_size: 60        # n units in x (Optuna tuned)
  vestibular_size: 1          # vestibular input dimension

  # Timescales (leaky integration)
  alpha_H: 0.1                # slow timescale for higher layer
  alpha_x: 0.5                # faster timescale for associative layer

  # Inference learning rates (state optimization within timestep)
  inference_learning_rate_H: 0.05
  inference_learning_rate_x: 0.049706088801492805    # Optuna tuned

  # Weight learning rates (Hebbian updates)
  weight_learning_rate_H: 0.01
  weight_learning_rate_x: 0.47037325216247716        # Optuna tuned

  # Inference steps
  n_inference_steps: 34       # Optuna tuned

saving:
  base_dir: "experiments"
  log_every: 10

logging:
  level: "INFO"

testing:
  test_duration: 14.0
  continuation: false
  prediction_timing: "after"