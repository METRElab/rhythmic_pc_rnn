# E4: naturalistic gait timing. Combined sensorimotor at a single mean tempo, but
# beats follow fractal (1/f) stride-to-stride variability. The vestibular triangle is
# built from the SAME jittered onsets, so the two modalities stay phase-locked while
# the tempo wanders. Tests whether the headline phenomena survive realistic gait.
experiment:
  dt: 0.05
  duration: 10.0
  mode: sensorimotor
  random_phase: true
  zero_mean_beat: true
  n_training_rounds: 10000
  name: rev_fractal
  random_seed: 746              # match the final published runs (only gait_variability differs)
  tempo:
    mode: single
    value: 0.5
    min: 0.4
    max: 0.8
    step: 0.1

  auditory_envelope:
    shape: pulse                  # swap to exp/alpha for the "realistic envelope + fractal" combo
    width: 0.1
    amplitude_jitter: 0.0
    width_jitter: 0.0

  gait_variability:
    mode: fractal                 # white | fractal
    sigma: 0.04                   # ~4% stride-to-stride CV
    hurst: 0.85                   # gait-like long-range correlation

logging:
  level: INFO

network:
  alpha_H: 0.1
  alpha_x: 1
  associative_size: 64
  higher_size: 0
  inference_learning_rate_H: 0.049706088801492805
  inference_learning_rate_x: 0.26109253426023427
  n_inference_steps: 5
  vestibular_size: 1
  weight_learning_rate_H: 0.47037325216247716
  weight_learning_rate_x: 0.49832988896925373

saving:
  base_dir: experiments/revision2
  log_every: 2000
  save_every: 2000          # regular checkpoints for the step/tempo viewer

testing:
  continuation: false
  n_inference_rounds: 50
  prediction_timing: after
  test_duration: 20.0
