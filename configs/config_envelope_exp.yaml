# E1 example: combined sensorimotor at a single tempo with a SMEARED auditory
# envelope (exponential decay, tau = 0.15 s). Example of one point on the
# discrete->continuous sweep axis. The sweep driver will vary shape/width.
experiment:
  dt: 0.05
  duration: 10.0
  mode: sensorimotor
  random_phase: true
  zero_mean_beat: true
  n_training_rounds: 10000
  name: rev_envelope_exp
  random_seed: 746              # match the final published runs (only auditory_envelope differs)
  tempo:
    mode: single
    value: 0.5
    min: 0.4
    max: 0.8
    step: 0.1

  auditory_envelope:
    shape: exp                    # sharp attack, exponential decay
    width: 0.15                   # tau in seconds (0.3 of the 0.5 s period)
    amplitude_jitter: 0.0
    width_jitter: 0.0

  gait_variability:
    mode: none
    sigma: 0.04
    hurst: 0.85

logging:
  level: INFO

network:
  alpha_H: 0.1
  alpha_x: 1
  associative_size: 64
  higher_size: 0
  inference_learning_rate_H: 0.049706088801492805
  inference_learning_rate_x: 0.26109253426023427
  n_inference_steps: 5
  vestibular_size: 1
  weight_learning_rate_H: 0.47037325216247716
  weight_learning_rate_x: 0.49832988896925373

saving:
  base_dir: experiments/paper_revision
  log_every: 2000

testing:
  continuation: false
  n_inference_rounds: 50
  prediction_timing: after
  test_duration: 20.0
