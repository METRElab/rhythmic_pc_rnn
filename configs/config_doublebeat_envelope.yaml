# E1/E2 auditory-only condition: doublebeat = the SAME auditory signal on both
# channels, with NO continuous vestibular triangle. With a smeared envelope this is
# the "damped auditory only" test - can the auditory envelope alone solve the
# temporal credit-assignment problem? Jon predicts it fails (and certainly fails
# across multiple tempos with a fixed-width envelope).
experiment:
  dt: 0.05
  duration: 10.0
  mode: doublebeat
  random_phase: true
  zero_mean_beat: true
  n_training_rounds: 10000
  name: rev_doublebeat_envelope
  random_seed: 746              # match the final published doublebeat run (only auditory_envelope differs)
  tempo:
    mode: single
    value: 0.5
    min: 0.4
    max: 0.8
    step: 0.1

  auditory_envelope:
    shape: exp
    width: 0.15
    amplitude_jitter: 0.0
    width_jitter: 0.0

  gait_variability:
    mode: none
    sigma: 0.04
    hurst: 0.85

logging:
  level: INFO

network:
  alpha_H: 0.1
  alpha_x: 1
  associative_size: 64
  higher_size: 0
  inference_learning_rate_H: 0.049706088801492805
  inference_learning_rate_x: 0.26109253426023427
  n_inference_steps: 5
  vestibular_size: 1
  weight_learning_rate_H: 0.47037325216247716
  weight_learning_rate_x: 0.49832988896925373

saving:
  base_dir: experiments/revision2
  log_every: 2000
  save_every: 2000          # regular checkpoints for the step/tempo viewer

testing:
  continuation: false
  n_inference_rounds: 50
  prediction_timing: after
  test_duration: 20.0
